<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seller login | Fieldfolk</title>
  <link rel="stylesheet" href="fieldfolk.css">
</head>
<body>
  <header>
    <a class="brand" href="index.html"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#e8a81d"/><path d="M8 22C8 12 16 8 24 8c0 10-6 16-16 14z" fill="#2f6b3a"/></svg> Fieldfolk</a>
    <nav><a href="index.html">Change role</a></nav>
  </header>
  <main class="auth">
    <h1>Seller login</h1>
    <form onsubmit="return login(event, 'seller')">
      <label for="mobile">Mobile number</label>
      <input type="tel" id="mobile" placeholder="10 digits" pattern="[0-9]{10}" title="Enter a 10 digit mobile number" required>
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
      <button type="submit">Log in as seller</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>
  </main>
  <footer><p>Fieldfolk: farm produce marketplace</p></footer>
  <script src="fieldfolk.js"></script>
</body>
</html>
