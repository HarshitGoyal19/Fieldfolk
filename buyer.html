<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse produce | Fieldfolk</title>
  <link rel="stylesheet" href="fieldfolk.css">
</head>
<body>
  <header>
    <a class="brand" href="index.html"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#e8a81d"/><path d="M8 22C8 12 16 8 24 8c0 10-6 16-16 14z" fill="#2f6b3a"/></svg> Fieldfolk</a>
    <nav>
      <a href="#browse">Browse produce</a>
      <a href="#orders">My requests</a>
      <a href="index.html">Log out</a>
    </nav>
  </header>
  <main>
    <section id="browse">
      <h2>Browse produce</h2>
      <div class="filters" role="search">
        <input type="search" id="search" placeholder="Search by name, e.g. wheat" aria-label="Search produce by name" oninput="showProduce()">
        <select id="category" aria-label="Filter by category" onchange="showProduce()">
          <option value="All">All categories</option>
          <option>Grains</option>
          <option>Vegetables</option>
          <option>Fruits</option>
          <option>Dairy</option>
        </select>
      </div>
      <p class="msg" id="orderMsg" role="status"></p>
      <div class="grid" id="produceList"></div>
    </section>
    <section id="orders">
      <h2>My requests</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>Product</th><th>Farmer</th><th>Quantity</th><th>Status</th></tr></thead>
          <tbody id="orderRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer><p>Fieldfolk: farm produce marketplace</p></footer>
  <script src="fieldfolk.js"></script>
  <script>showProduce(); showOrders();</script>
</body>
</html>
