<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seller desk | Fieldfolk</title>
  <link rel="stylesheet" href="fieldfolk.css">
</head>
<body>
  <header>
    <a class="brand" href="index.html"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#e8a81d"/><path d="M8 22C8 12 16 8 24 8c0 10-6 16-16 14z" fill="#2f6b3a"/></svg> Fieldfolk</a>
    <nav>
      <a href="#listings">My listings</a>
      <a href="#requests">Buyer requests</a>
      <a href="index.html">Log out</a>
    </nav>
  </header>
  <main>
    <section id="profile">
      <h2>My farmer profile</h2>
      <dl id="profileInfo"></dl>
    </section>
    <section id="listings">
      <h2>My listings</h2>
      <form onsubmit="return addListing(event)">
        <label for="product">Product</label>
        <input type="text" id="product" required>
        <label for="newCategory">Category</label>
        <select id="newCategory">
          <option>Grains</option>
          <option>Vegetables</option>
          <option>Fruits</option>
          <option>Dairy</option>
        </select>
        <label for="quantity">Quantity (kg)</label>
        <input type="number" id="quantity" min="1" required>
        <label for="price">Price per kg (₹)</label>
        <input type="number" id="price" min="1" required>
        <label for="available">Expected availability</label>
        <input type="date" id="available" required>
        <button type="submit">Add listing</button>
        <p class="msg" id="listingMsg" role="status"></p>
      </form>
      <div class="scroll">
        <table>
          <thead><tr><th>Product</th><th>Category</th><th>Quantity</th><th>Price</th><th>Available</th></tr></thead>
          <tbody id="listingRows"></tbody>
        </table>
      </div>
    </section>
    <section id="requests">
      <h2>Buyer requests</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>Buyer</th><th>Product</th><th>Quantity</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="requestRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer><p>Fieldfolk: farm produce marketplace</p></footer>
  <script src="fieldfolk.js"></script>
  <script>showProfile(); showListings(); showRequests();</script>
</body>
</html>
